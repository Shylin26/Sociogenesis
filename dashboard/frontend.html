<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOCIOGENESIS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #060608;
            --s1: #0d0d10;
            --s2: #13131a;
            --s3: #1a1a24;
            --s4: #22222e;
            --border: rgba(255, 255, 255, 0.06);
            --border2: rgba(255, 255, 255, 0.10);
            --border3: rgba(255, 255, 255, 0.16);
            --t0: #f1f1f3;
            --t1: #9898a8;
            --t2: #55556a;
            --t3: #35354a;
            --blue: #5b8def;
            --blue2: rgba(91, 141, 239, 0.12);
            --blue3: rgba(91, 141, 239, 0.06);
            --green: #34d399;
            --green2: rgba(52, 211, 153, 0.12);
            --amber: #fbbf24;
            --amber2: rgba(251, 191, 36, 0.12);
            --purple: #a78bfa;
            --purple2: rgba(167, 139, 250, 0.12);
            --red: #f87171;
            --red2: rgba(248, 113, 113, 0.12);
            --code: #5b8def;
            --research: #fbbf24;
            --visual: #34d399;
        }

        html,
        body,
        #root {
            height: 100%;
            background: var(--bg);
            color: var(--t0);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale
        }

        ::-webkit-scrollbar {
            width: 3px;
            height: 3px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border3);
            border-radius: 2px
        }

        .mono {
            font-family: 'JetBrains Mono', monospace
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script>
        const { useState, useEffect, useRef, useCallback, useMemo } = React;
        const { LineChart, Line, AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, BarChart, Bar, Cell } = Recharts;

        const RC = { code: '#5b8def', research: '#fbbf24', visual: '#34d399', unknown: '#55556a' };
        const RBG = { code: 'rgba(91,141,239,0.15)', research: 'rgba(251,191,36,0.15)', visual: 'rgba(52,211,153,0.15)', unknown: 'rgba(85,85,106,0.15)' };

        // ── ATOMS ──────────────────────────────────────────────────────────────────

        function Badge({ children, color = 'blue' }) {
            const colors = {
                blue: 'background:rgba(91,141,239,0.12);color:#5b8def;border:1px solid rgba(91,141,239,0.25)',
                green: 'background:rgba(52,211,153,0.12);color:#34d399;border:1px solid rgba(52,211,153,0.25)',
                amber: 'background:rgba(251,191,36,0.12);color:#fbbf24;border:1px solid rgba(251,191,36,0.25)',
                purple: 'background:rgba(167,139,250,0.12);color:#a78bfa;border:1px solid rgba(167,139,250,0.25)',
                red: 'background:rgba(248,113,113,0.12);color:#f87171;border:1px solid rgba(248,113,113,0.25)',
            };
            return React.createElement('span', {
                style: {
                    padding: '2px 8px', borderRadius: 20, fontSize: 10, fontWeight: 600,
                    letterSpacing: '0.5px', textTransform: 'uppercase',
                    ...(Object.fromEntries(colors[color].split(';').map(s => s.split(':').map(x => x.trim())).filter(x => x.length === 2)
                        .map(([k, v]) => [k.replace(/-([a-z])/g, (_, c) => c.toUpperCase()), v])))
                }
            }, children);
        }

        function Stat({ value, label, color = '', large = false }) {
            const colorMap = { blue: '#5b8def', green: '#34d399', amber: '#fbbf24', purple: '#a78bfa', red: '#f87171', '': `var(--t0)` };
            return React.createElement('div', {
                style: {
                    background: 'var(--s2)', border: '1px solid var(--border)',
                    borderRadius: 8, padding: '10px 12px',
                }
            },
                React.createElement('div', {
                    style: {
                        fontSize: large ? 24 : 18, fontWeight: 700, color: colorMap[color] || 'var(--t0)',
                        lineHeight: 1, fontFamily: "'JetBrains Mono',monospace", letterSpacing: '-0.5px'
                    }
                }, value),
                React.createElement('div', { style: { fontSize: 10, color: 'var(--t2)', marginTop: 4, letterSpacing: '0.5px', textTransform: 'uppercase' } }, label)
            );
        }

        function SectionLabel({ children, action }) {
            return React.createElement('div', {
                style: {
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                    padding: '12px 16px 8px', borderBottom: '1px solid var(--border)', flexShrink: 0
                }
            },
                React.createElement('div', { style: { fontSize: 10, fontWeight: 600, color: 'var(--t2)', letterSpacing: '1.5px', textTransform: 'uppercase' } }, children),
                action
            );
        }

        // ── AGENT GRAPH (D3) ───────────────────────────────────────────────────────

        function AgentGraph({ agents, coalitions }) {
            const svgRef = useRef(null);
            const simRef = useRef(null);
            const nodesRef = useRef([]);
            const initialized = useRef(false);

            useEffect(() => {
                if (!svgRef.current) return;
                const el = svgRef.current;
                const { width: w, height: h } = el.getBoundingClientRect();
                if (!w || !h) return;

                const svg = d3.select(el);

                if (!initialized.current) {
                    initialized.current = true;
                    svg.selectAll('*').remove();
                    svg.append('g').attr('class', 'links');
                    svg.append('g').attr('class', 'nodes');

                    simRef.current = d3.forceSimulation()
                        .force('link', d3.forceLink().id(d => d.id).distance(85).strength(0.5))
                        .force('charge', d3.forceManyBody().strength(-320))
                        .force('center', d3.forceCenter(w / 2, h / 2))
                        .force('collision', d3.forceCollide().radius(d => d.r + 14))
                        .force('bound', () => {
                            nodesRef.current.forEach(n => {
                                n.x = Math.max(n.r + 20, Math.min(w - n.r - 20, n.x || w / 2));
                                n.y = Math.max(n.r + 20, Math.min(h - n.r - 20, n.y || h / 2));
                            });
                        });
                }

                const prev = {};
                nodesRef.current.forEach(n => { prev[n.id] = { x: n.x, y: n.y, vx: n.vx || 0, vy: n.vy || 0 }; });

                const newNodes = agents.map(a => {
                    const p = prev[a.id] || { x: w / 2 + (Math.random() - .5) * 200, y: h / 2 + (Math.random() - .5) * 200, vx: 0, vy: 0 };
                    return {
                        id: a.id, role: a.role, rep: a.reputation, tok: a.tokens,
                        r: Math.max(16, Math.min(32, 16 + a.reputation * 22)),
                        x: p.x, y: p.y, vx: p.vx, vy: p.vy
                    };
                });
                nodesRef.current = newNodes;

                const links = [];
                coalitions.forEach(c => {
                    const m = c.members || [];
                    for (let i = 0; i < m.length - 1; i++) links.push({ source: m[i], target: m[i + 1] });
                });

                const linkG = svg.select('g.links');
                const nodeG = svg.select('g.nodes');

                linkG.selectAll('line').data(links, d => `${d.source}-${d.target}`)
                    .join(
                        e => e.append('line')
                            .attr('stroke', 'rgba(167,139,250,0.45)')
                            .attr('stroke-width', 2)
                            .attr('stroke-dasharray', '5,4'),
                        u => u, x => x.remove()
                    );

                const ng = nodeG.selectAll('g.ag').data(newNodes, d => d.id)
                    .join(
                        enter => {
                            const g = enter.append('g').attr('class', 'ag').style('cursor', 'grab');
                            g.append('circle').attr('class', 'glow').attr('fill', 'none').attr('stroke-width', 1.5).attr('opacity', 0.2);
                            g.append('circle').attr('class', 'body');
                            g.append('text').attr('class', 'name').attr('text-anchor', 'middle').attr('dy', '0.35em')
                                .attr('fill', 'rgba(255,255,255,0.95)').style('pointer-events', 'none')
                                .style('font-family', "'JetBrains Mono',monospace").style('font-weight', '600');
                            g.append('text').attr('class', 'role').attr('text-anchor', 'middle')
                                .attr('fill', 'rgba(255,255,255,0.35)').style('pointer-events', 'none')
                                .style('font-family', "'Inter',sans-serif").style('font-weight', '500');
                            return g;
                        },
                        u => u, x => x.remove()
                    );

                ng.select('.glow')
                    .attr('r', d => d.r + 10)
                    .attr('stroke', d => RC[d.role] || RC.unknown)
                    .attr('opacity', d => Math.min(0.45, 0.05 + d.rep * 0.45));

                ng.select('.body')
                    .attr('r', d => d.r)
                    .attr('fill', d => RBG[d.role] || RBG.unknown)
                    .attr('stroke', d => RC[d.role] || RC.unknown)
                    .attr('stroke-width', 1.5)
                    .attr('stroke-opacity', 0.7);

                ng.select('.name').attr('font-size', d => d.r < 20 ? 9 : 11).text(d => `A${d.id}`);
                ng.select('.role').attr('dy', d => d.r + 14).attr('font-size', 8)
                    .text(d => d.role === 'unknown' ? '' : d.role.slice(0, 3).toUpperCase());

                ng.call(d3.drag()
                    .on('start', (e, d) => { if (!e.active) simRef.current.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
                    .on('end', (e, d) => { if (!e.active) simRef.current.alphaTarget(0); d.fx = null; d.fy = null; })
                );

                simRef.current.nodes(newNodes).on('tick', () => {
                    linkG.selectAll('line')
                        .attr('x1', d => typeof d.source === 'object' ? d.source.x : 0)
                        .attr('y1', d => typeof d.source === 'object' ? d.source.y : 0)
                        .attr('x2', d => typeof d.target === 'object' ? d.target.x : 0)
                        .attr('y2', d => typeof d.target === 'object' ? d.target.y : 0);
                    nodeG.selectAll('g.ag').attr('transform', d => `translate(${d.x || 0},${d.y || 0})`);
                });
                simRef.current.force('link').links(links);
                simRef.current.force('center', d3.forceCenter(w / 2, h / 2));
                simRef.current.alpha(0.2).restart();
            }, [agents, coalitions]);

            return React.createElement('svg', {
                ref: svgRef,
                style: { width: '100%', height: '100%', display: 'block' }
            });
        }

        // ── QUALITY CHART ──────────────────────────────────────────────────────────

        function QualityChart({ history }) {
            const data = history.slice(-60).map((v, i) => ({ i, q: v }));
            return React.createElement(ResponsiveContainer, { width: '100%', height: 60 },
                React.createElement(AreaChart, { data, margin: { top: 4, right: 0, bottom: 0, left: 0 } },
                    React.createElement('defs', null,
                        React.createElement('linearGradient', { id: 'qg', x1: '0', y1: '0', x2: '0', y2: '1' },
                            React.createElement('stop', { offset: '5%', stopColor: '#5b8def', stopOpacity: 0.3 }),
                            React.createElement('stop', { offset: '95%', stopColor: '#5b8def', stopOpacity: 0 })
                        )
                    ),
                    React.createElement(XAxis, { dataKey: 'i', hide: true }),
                    React.createElement(YAxis, { domain: [0, 1], hide: true }),
                    React.createElement(Area, {
                        type: 'monotone', dataKey: 'q', stroke: '#5b8def',
                        strokeWidth: 1.5, fill: 'url(#qg)', dot: false, isAnimationActive: false
                    })
                )
            );
        }

        // ── TOKEN BARS ─────────────────────────────────────────────────────────────

        function TokenBars({ agents }) {
            const max = Math.max(...agents.map(a => a.tokens), 1);
            return React.createElement('div', { style: { padding: '4px 0' } },
                agents.map(a =>
                    React.createElement('div', {
                        key: a.id, style: {
                            display: 'flex', alignItems: 'center', gap: 8,
                            padding: '4px 16px',
                        }
                    },
                        React.createElement('div', {
                            style: {
                                width: 24, fontSize: 10, color: 'var(--t2)', textAlign: 'right',
                                fontFamily: "'JetBrains Mono',monospace", flexShrink: 0
                            }
                        }, `A${a.id}`),
                        React.createElement('div', {
                            style: {
                                flex: 1, height: 6, background: 'var(--s3)', borderRadius: 3, overflow: 'hidden'
                            }
                        },
                            React.createElement('div', {
                                style: {
                                    height: '100%', borderRadius: 3,
                                    width: `${(a.tokens / max * 100).toFixed(1)}%`,
                                    background: RC[a.role] || RC.unknown,
                                    opacity: 0.85,
                                    transition: 'width 0.6s cubic-bezier(0.4,0,0.2,1)'
                                }
                            })
                        ),
                        React.createElement('div', {
                            style: {
                                width: 44, fontSize: 10, color: 'var(--t1)', textAlign: 'right',
                                fontFamily: "'JetBrains Mono',monospace", flexShrink: 0
                            }
                        }, a.tokens)
                    )
                )
            );
        }

        // ── EVENTS ─────────────────────────────────────────────────────────────────

        function EventFeed({ events }) {
            const icons = { coal: '⬡', solo: '→', evo: '↻', ms: '✓' };
            const colors = {
                coal: 'var(--purple)', solo: 'var(--t2)',
                evo: 'var(--red)', ms: 'var(--green)'
            };
            return React.createElement('div', null,
                events.slice(0, 20).map((ev, i) =>
                    React.createElement('div', {
                        key: i, style: {
                            display: 'flex', gap: 10, padding: '10px 16px',
                            borderBottom: '1px solid var(--border)', alignItems: 'flex-start'
                        }
                    },
                        React.createElement('div', {
                            style: {
                                width: 26, height: 26, borderRadius: 6, flexShrink: 0,
                                display: 'flex', alignItems: 'center', justifyContent: 'center',
                                fontSize: 11, fontWeight: 700, marginTop: 1,
                                color: colors[ev.t],
                                background: `${colors[ev.t]}20`,
                            }
                        }, icons[ev.t] || '·'),
                        React.createElement('div', { style: { flex: 1, minWidth: 0 } },
                            React.createElement('div', {
                                style: {
                                    fontSize: 12, color: 'var(--t0)', lineHeight: 1.5,
                                    whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'
                                }
                            }, ev.title),
                            React.createElement('div', { style: { fontSize: 10, color: 'var(--t2)', marginTop: 2 } }, ev.meta)
                        )
                    )
                )
            );
        }

        // ── ARTIFACTS ──────────────────────────────────────────────────────────────

        function ArtifactFeed({ artifacts }) {
            const typeColor = { code: 'var(--code)', research: 'var(--research)', visual: 'var(--visual)' };
            const typeBorder = { code: '#5b8def', research: '#fbbf24', visual: '#34d399' };
            return React.createElement('div', null,
                [...artifacts].reverse().map((a, i) => {
                    const qc = a.quality >= 0.8 ? '#34d399' : a.quality >= 0.5 ? '#fbbf24' : '#f87171';
                    const who = a.mode === 'COALITION' ? 'coalition' : `agent A${a.agent_id}`;
                    return React.createElement('div', {
                        key: i, style: {
                            padding: '10px 16px', borderBottom: '1px solid var(--border)',
                            borderLeft: `2px solid ${typeBorder[a.type] || 'var(--border3)'}`,
                        }
                    },
                        React.createElement('div', {
                            style: {
                                display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 3
                            }
                        },
                            React.createElement('span', {
                                style: {
                                    fontSize: 10, fontWeight: 700, letterSpacing: '0.8px',
                                    textTransform: 'uppercase', color: typeColor[a.type] || 'var(--t1)'
                                }
                            }, a.type),
                            React.createElement('span', {
                                style: {
                                    fontSize: 13, fontWeight: 600, color: qc,
                                    fontFamily: "'JetBrains Mono',monospace"
                                }
                            }, (a.quality || 0).toFixed(3))
                        ),
                        React.createElement('div', { style: { fontSize: 10, color: 'var(--t2)' } },
                            `Tick ${a.tick} · ${who}`
                        )
                    );
                })
            );
        }

        // ── COALITION CARDS ────────────────────────────────────────────────────────

        function CoalitionCards({ coalitions, agentRoles }) {
            if (!coalitions.length)
                return React.createElement('div', {
                    style: {
                        padding: '16px', fontSize: 12, color: 'var(--t2)', fontStyle: 'italic'
                    }
                }, 'No active coalitions');

            return React.createElement('div', { style: { padding: '8px 16px' } },
                coalitions.map((c, i) =>
                    React.createElement('div', {
                        key: i, style: {
                            background: 'var(--s2)', border: '1px solid rgba(167,139,250,0.2)',
                            borderRadius: 8, padding: '10px 12px', marginBottom: 8
                        }
                    },
                        React.createElement('div', {
                            style: {
                                fontSize: 12, fontWeight: 600, color: 'var(--t0)', marginBottom: 2
                            }
                        }, `${c.task_type || 'unknown'} task`),
                        React.createElement('div', { style: { fontSize: 10, color: 'var(--t2)', marginBottom: 8 } },
                            `Coordinator: A${c.coordinator} · ${(c.coalition_id || '').slice(0, 12)}`
                        ),
                        React.createElement('div', { style: { display: 'flex', gap: 5, flexWrap: 'wrap' } },
                            (c.members || []).map(id => {
                                const role = agentRoles[id] || 'unknown';
                                return React.createElement('div', {
                                    key: id, style: {
                                        width: 30, height: 30, borderRadius: '50%',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                                        fontSize: 9, fontWeight: 700,
                                        background: RBG[role], color: RC[role],
                                        border: `1.5px solid ${RC[role]}50`,
                                        fontFamily: "'JetBrains Mono',monospace"
                                    }
                                }, `A${id}`);
                            })
                        )
                    )
                )
            );
        }

        // ── MILESTONES ─────────────────────────────────────────────────────────────

        function Milestones({ done }) {
            const all = [
                { id: 'c1', l: 'First coalition formed' },
                { id: 'r3', l: '3 role clusters emerged' },
                { id: 'e100', l: '100 memories stored' },
                { id: 'e500', l: '500 memories stored' },
                { id: 'ev1', l: 'First agent evolved' },
                { id: 'n10', l: '10 semantic nodes' },
                { id: 't500', l: '500 ticks completed' },
                { id: 't1k', l: '1000 ticks completed' },
            ];
            return React.createElement('div', { style: { padding: '4px 0' } },
                all.map(m =>
                    React.createElement('div', {
                        key: m.id, style: {
                            display: 'flex', alignItems: 'center', gap: 10,
                            padding: '7px 16px',
                            opacity: done[m.id] ? 1 : 0.35,
                        }
                    },
                        React.createElement('div', {
                            style: {
                                width: 6, height: 6, borderRadius: '50%', flexShrink: 0,
                                background: done[m.id] ? 'var(--green)' : 'var(--t3)',
                                boxShadow: done[m.id] ? '0 0 6px rgba(52,211,153,0.5)' : 'none',
                            }
                        }),
                        React.createElement('div', {
                            style: {
                                fontSize: 11, color: done[m.id] ? 'var(--t0)' : 'var(--t2)'
                            }
                        }, m.l)
                    )
                )
            );
        }

        // ── MAIN APP ───────────────────────────────────────────────────────────────

        function App() {
            const [data, setData] = useState(null);
            const [events, setEvents] = useState([{ t: 'solo', title: 'Society starting', meta: 'Agents initialising' }]);
            const [qualHist, setQualHist] = useState([]);
            const [doneMS, setDoneMS] = useState({});
            const [evoCount, setEvoCount] = useState(0);
            const [agentRoles, setAgentRoles] = useState({});
            const lastTickRef = useRef(-1);
            const lastCoalRef = useRef(0);

            const addEvent = useCallback((t, title, meta) => {
                setEvents(prev => [{ t, title, meta }, ...prev].slice(0, 50));
            }, []);

            useEffect(() => {
                const ws = new WebSocket(`ws://${location.host}/ws/society`);
                ws.onmessage = e => {
                    const d = JSON.parse(e.data);
                    setData(d);

                    const roles = {};
                    (d.agents || []).forEach(a => { roles[a.id] = a.role; });
                    setAgentRoles(roles);

                    const arts = d.recent_artifacts || [];
                    if (arts.length) setQualHist(prev => [...prev, ...arts.map(a => a.quality)].slice(-120));

                    if (d.tick !== lastTickRef.current) {
                        lastTickRef.current = d.tick;
                        if (arts.length) {
                            const a = arts[arts.length - 1];
                            if (a.mode === 'COALITION')
                                addEvent('coal', `Coalition produced ${a.type} artifact`, `Quality ${(a.quality || 0).toFixed(3)} · tick ${a.tick}`);
                        }
                    }

                    if ((d.active_coalitions || []).length > lastCoalRef.current && (d.active_coalitions || []).length > 0) {
                        const c = d.active_coalitions[0];
                        addEvent('coal', `New coalition — ${c.task_type} task`,
                            `Agents ${(c.members || []).map(i => 'A' + i).join(', ')} · coordinator A${c.coordinator}`);
                    }
                    lastCoalRef.current = (d.active_coalitions || []).length;

                    setDoneMS(prev => {
                        const next = { ...prev };
                        const roles2 = d.roles || {};
                        if (!next.c1 && (d.active_coalitions || []).length > 0) next.c1 = true;
                        if (!next.r3 && Object.keys(roles2).length >= 3) next.r3 = true;
                        if (!next.e100 && d.episodic_count >= 100) next.e100 = true;
                        if (!next.e500 && d.episodic_count >= 500) next.e500 = true;
                        if (!next.n10 && d.semantic_nodes >= 10) next.n10 = true;
                        if (!next.t500 && d.tick >= 500) next.t500 = true;
                        if (!next.t1k && d.tick >= 1000) next.t1k = true;
                        return next;
                    });
                };
                ws.onclose = () => { addEvent('evo', 'Disconnected', 'Refresh to reconnect'); };
                return () => ws.close();
            }, [addEvent]);

            const avgQuality = useMemo(() => {
                if (!qualHist.length) return null;
                const sl = qualHist.slice(-30);
                return (sl.reduce((a, b) => a + b, 0) / sl.length).toFixed(3);
            }, [qualHist]);

            const roles = data?.roles || {};
            const nRoles = Object.keys(roles).length;
            const agents = data?.agents || [];
            const coalitions = data?.active_coalitions || [];
            const sm = data?.society_model || {};

            const heroText = nRoles >= 3
                ? `${agents.length} agents → ${nRoles} specialist roles`
                : nRoles >= 2
                    ? `${agents.length} agents → ${nRoles} roles forming`
                    : `${agents.length} identical agents`;

            const heroSub = nRoles >= 3
                ? `Started identical. Now specialised. Nobody assigned these roles — they emerged.`
                : `Specialisation beginning through task exposure and economic pressure.`;

            return React.createElement('div', { style: { height: '100%', display: 'flex', flexDirection: 'column' } },

                // ── TOPBAR ──
                React.createElement('div', {
                    style: {
                        height: 52, background: 'rgba(6,6,8,0.9)', borderBottom: '1px solid var(--border)',
                        backdropFilter: 'blur(12px)', display: 'flex', alignItems: 'center',
                        padding: '0 20px', gap: 12, flexShrink: 0, zIndex: 100,
                        position: 'sticky', top: 0,
                    }
                },
                    React.createElement('div', {
                        style: {
                            width: 7, height: 7, borderRadius: '50%', background: 'var(--green)',
                            animation: 'pulse 2s ease-in-out infinite', flexShrink: 0,
                            boxShadow: '0 0 8px rgba(52,211,153,0.6)'
                        }
                    }),
                    React.createElement('style', null, `@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}`),
                    React.createElement('div', {
                        style: {
                            fontSize: 14, fontWeight: 700, letterSpacing: '1px', color: 'var(--t0)', marginRight: 4
                        }
                    },
                        'SOCIO',
                        React.createElement('span', { style: { color: 'var(--blue)' } }, 'GENESIS')
                    ),
                    React.createElement('div', {
                        style: {
                            padding: '2px 7px', borderRadius: 4, fontSize: 10, fontWeight: 600,
                            background: 'var(--green2)', color: 'var(--green)',
                            border: '1px solid rgba(52,211,153,0.25)', letterSpacing: '0.5px'
                        }
                    }, 'LIVE'),

                    React.createElement('div', { style: { width: 1, height: 20, background: 'var(--border)', margin: '0 4px' } }),

                    ...[
                        { v: data?.tick || 0, l: 'tick', c: 'var(--blue)' },
                        { v: avgQuality || '—', l: 'avg quality', c: 'var(--green)' },
                        { v: data?.episodic_count || 0, l: 'memories', c: 'var(--amber)' },
                        { v: nRoles, l: 'role clusters', c: 'var(--purple)' },
                    ].flatMap((s, i) => [
                        i > 0 ? React.createElement('div', { key: `sep${i}`, style: { width: 1, height: 20, background: 'var(--border)', margin: '0 2px' } }) : null,
                        React.createElement('div', { key: s.l, style: { display: 'flex', flexDirection: 'column', padding: '0 10px' } },
                            React.createElement('div', {
                                style: {
                                    fontSize: 15, fontWeight: 700, color: s.c, lineHeight: 1,
                                    fontFamily: "'JetBrains Mono',monospace", letterSpacing: '-0.5px'
                                }
                            }, s.v),
                            React.createElement('div', { style: { fontSize: 9, color: 'var(--t2)', marginTop: 2, letterSpacing: '0.5px', textTransform: 'uppercase' } }, s.l)
                        )
                    ].filter(Boolean)),

                    React.createElement('div', { style: { flex: 1 } }),
                    React.createElement('a', {
                        href: '/paper', target: '_blank',
                        style: {
                            padding: '6px 14px', borderRadius: 6, fontSize: 11, fontWeight: 500,
                            background: 'var(--s3)', color: 'var(--t0)', border: '1px solid var(--border2)',
                            textDecoration: 'none', letterSpacing: '0.2px', cursor: 'pointer',
                            transition: 'background 0.15s'
                        },
                        onMouseEnter: e => e.target.style.background = 'var(--s4)',
                        onMouseLeave: e => e.target.style.background = 'var(--s3)',
                    }, 'Download paper')
                ),

                // ── BODY ──
                React.createElement('div', {
                    style: {
                        flex: 1, display: 'grid', minHeight: 0,
                        gridTemplateColumns: '260px 1fr 300px',
                        gridTemplateRows: '100%',
                        gap: 0, overflow: 'hidden',
                    }
                },

                    // LEFT
                    React.createElement('div', {
                        style: {
                            borderRight: '1px solid var(--border)', display: 'flex',
                            flexDirection: 'column', overflow: 'hidden',
                        }
                    },
                        // Hero
                        React.createElement('div', {
                            style: {
                                padding: '20px 16px 16px', borderBottom: '1px solid var(--border)', flexShrink: 0
                            }
                        },
                            React.createElement('div', {
                                style: {
                                    fontSize: 22, fontWeight: 700, color: 'var(--t0)', lineHeight: 1.2,
                                    letterSpacing: '-0.5px', marginBottom: 8
                                }
                            },
                                heroText.split('→').map((part, i, arr) =>
                                    i < arr.length - 1
                                        ? [part, React.createElement('span', { key: i, style: { color: 'var(--blue)' } }, '→')]
                                        : part
                                ).flat()
                            ),
                            React.createElement('div', {
                                style: {
                                    fontSize: 12, color: 'var(--t1)', lineHeight: 1.6, marginBottom: 12
                                }
                            }, heroSub),
                            React.createElement('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 5 } },
                                Object.entries(roles).map(([r, c]) =>
                                    React.createElement('div', {
                                        key: r, style: {
                                            padding: '3px 10px', borderRadius: 20, fontSize: 10, fontWeight: 600,
                                            letterSpacing: '0.5px', textTransform: 'uppercase',
                                            background: RBG[r], color: RC[r],
                                            border: `1px solid ${RC[r]}40`
                                        }
                                    }, `${c} ${r}`)
                                )
                            )
                        ),

                        // KPIs
                        React.createElement('div', {
                            style: {
                                display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6,
                                padding: '10px 16px', borderBottom: '1px solid var(--border)', flexShrink: 0
                            }
                        },
                            React.createElement(Stat, { value: data?.tick || 0, label: 'Tick', color: 'blue' }),
                            React.createElement(Stat, { value: data?.episodic_count || 0, label: 'Episodic', color: 'green' }),
                            React.createElement(Stat, { value: data?.semantic_nodes || 0, label: 'Sem. nodes', color: 'amber' }),
                            React.createElement(Stat, { value: coalitions.length, label: 'Coalitions', color: 'purple' }),
                        ),

                        // Quality chart
                        React.createElement('div', {
                            style: {
                                padding: '8px 16px 6px', borderBottom: '1px solid var(--border)', flexShrink: 0
                            }
                        },
                            React.createElement('div', {
                                style: {
                                    fontSize: 9, color: 'var(--t2)', letterSpacing: '1px',
                                    textTransform: 'uppercase', marginBottom: 6
                                }
                            }, 'Quality history'),
                            React.createElement(QualityChart, { history: qualHist })
                        ),

                        // Token economy
                        React.createElement(SectionLabel, null, 'Token economy'),
                        React.createElement('div', { style: { flex: 1, overflowY: 'auto' } },
                            React.createElement(TokenBars, { agents })
                        ),

                        // Milestones
                        React.createElement(SectionLabel, null, 'Milestones'),
                        React.createElement('div', { style: { overflowY: 'auto', maxHeight: 200 } },
                            React.createElement(Milestones, { done: doneMS })
                        ),
                    ),

                    // CENTER
                    React.createElement('div', {
                        style: {
                            display: 'flex', flexDirection: 'column', overflow: 'hidden',
                            borderRight: '1px solid var(--border)',
                        }
                    },
                        React.createElement('div', {
                            style: {
                                padding: '12px 16px', borderBottom: '1px solid var(--border)',
                                display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0
                            }
                        },
                            React.createElement('div', {
                                style: {
                                    fontSize: 10, fontWeight: 600, color: 'var(--t2)',
                                    letterSpacing: '1.5px', textTransform: 'uppercase'
                                }
                            }, 'Agent society'),
                            coalitions.length > 0 && React.createElement('div', {
                                style: {
                                    fontSize: 11, fontWeight: 500, color: 'var(--purple)'
                                }
                            }, `${coalitions.length} coalition${coalitions.length > 1 ? 's' : ''} active`)
                        ),

                        React.createElement('div', { style: { flex: 1, minHeight: 0, position: 'relative' } },
                            React.createElement(AgentGraph, { agents, coalitions })
                        ),

                        React.createElement('div', {
                            style: {
                                height: 220, borderTop: '1px solid var(--border)',
                                display: 'flex', flexDirection: 'column', flexShrink: 0
                            }
                        },
                            React.createElement(SectionLabel, null, 'Live events'),
                            React.createElement('div', { style: { flex: 1, overflowY: 'auto' } },
                                React.createElement(EventFeed, { events })
                            )
                        )
                    ),

                    // RIGHT
                    React.createElement('div', {
                        style: {
                            display: 'flex', flexDirection: 'column', overflow: 'hidden'
                        }
                    },
                        // Coalitions
                        React.createElement(SectionLabel, null, 'Active coalitions'),
                        React.createElement('div', { style: { flexShrink: 0 } },
                            React.createElement(CoalitionCards, { coalitions, agentRoles })
                        ),

                        // Society model
                        React.createElement(SectionLabel, null, 'Society model'),
                        React.createElement('div', {
                            style: {
                                padding: '10px 16px', borderBottom: '1px solid var(--border)', flexShrink: 0
                            }
                        },
                            React.createElement('div', {
                                style: {
                                    display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, marginBottom: 10
                                }
                            },
                                React.createElement(Stat, { value: sm.train_steps || 0, label: 'Train steps', color: 'purple' }),
                                React.createElement(Stat, { value: sm.total_curiosity || 0, label: 'Curiosity', color: 'blue' }),
                            ),
                            React.createElement('div', {
                                style: {
                                    fontSize: 9, color: 'var(--t2)', letterSpacing: '0.5px',
                                    textTransform: 'uppercase', marginBottom: 5,
                                    display: 'flex', justifyContent: 'space-between'
                                }
                            },
                                React.createElement('span', null, 'Prediction loss'),
                                React.createElement('span', {
                                    style: {
                                        color: 'var(--purple)', fontFamily: "'JetBrains Mono',monospace"
                                    }
                                }, (sm.avg_loss || 0).toFixed(3))
                            ),
                            React.createElement('div', {
                                style: {
                                    height: 4, background: 'var(--s3)', borderRadius: 2, overflow: 'hidden'
                                }
                            },
                                React.createElement('div', {
                                    style: {
                                        height: '100%', borderRadius: 2, background: 'var(--purple)',
                                        width: `${Math.min(100, ((sm.avg_loss || 0) / 3) * 100).toFixed(1)}%`,
                                        transition: 'width 0.5s'
                                    }
                                })
                            )
                        ),

                        // Artifacts
                        React.createElement(SectionLabel, null, 'Artifact feed'),
                        React.createElement('div', { style: { flex: 1, overflowY: 'auto' } },
                            React.createElement(ArtifactFeed, { artifacts: data?.recent_artifacts || [] })
                        ),
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>

</html>
